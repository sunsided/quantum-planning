# https://github.com/crate-ci/typos/blob/master/docs/reference.md
[files]
extend-exclude = [
  "*.lock",
  "fuzz/corpus/**",
  "fuzz/artifacts/**",
  "**/proptest-regressions/**",
  "LICENSES/**",
  "LICENSE-*",
]

[default.extend-words]
# Project-specific words typos flags wrongly, e.g. `ser = "ser"`. Keep each entry justified.
# Amazon Braket, the quantum computing service that accepts OpenQASM 3.
Braket = "Braket"
# Andrew Childs, author of the NAND-tree quantum walk papers.
Childs = "Childs"

[default.extend-identifiers]
